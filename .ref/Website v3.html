<script type="text/babel">
function App() {
  // Scroll progress bar
  React.useEffect(() => {
    const bar = document.getElementById("scrollBar");
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
      if (bar) bar.style.width = pct + "%";
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Mouse-follow gradient (throttled)
  React.useEffect(() => {
    let raf = 0, x = 0, y = 0;
    const apply = () => {
      document.documentElement.style.setProperty("--mx", x + "px");
      document.documentElement.style.setProperty("--my", y + "px");
      raf = 0;
    };
    const onMove = (e) => {
      x = e.clientX; y = e.clientY;
      if (!raf) raf = requestAnimationFrame(apply);
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  // Reveal-on-scroll (3-pass)
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) el.classList.add("in");
    });
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add("in"); obs.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
    els.forEach(el => { if (!el.classList.contains("in")) obs.observe(el); });
    const t = setTimeout(() => {
      document.querySelectorAll(".reveal:not(.in)").forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight) el.classList.add("in");
      });
    }, 1200);
    return () => { obs.disconnect(); clearTimeout(t); };
  }, []);

  return (
    <>
      <Nav />
      <main>
        <Hero />
        <ClientLogos />
        <About />
        <CCTV />
        <Services />
        <ProductShowcase />
        <Partnership />
        <Portfolio />
        <Team />
        <FAQ />
        <Contact />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
  // Theme toggle (persisted)
  (function() {
    const KEY = "sentra-theme";
    const btn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>';
    const moon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
    function apply(theme) {
      document.body.classList.toggle("light", theme === "light");
      btn.classList.toggle("is-light", theme === "light");
      icon.innerHTML = theme === "light" ? sun : moon;
    }
    let stored = null;
    try { stored = localStorage.getItem(KEY); } catch (e) {}
    apply(stored || "dark");
    btn.addEventListener("click", () => {
      const next = document.body.classList.contains("light") ? "dark" : "light";
      apply(next);
      try { localStorage.setItem(KEY, next); } catch (e) {}
    });
  })();
</script>
