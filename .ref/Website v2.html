<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<title>Sentra Technology — IoT, AI & Software Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="IoT, AI, dan software end-to-end untuk pemerintahan, industri, dan korporasi Indonesia. Berbasis di Samarinda."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="website.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<!-- Ambient background orbs -->
<div class="bg-orb a"></div>
<div class="bg-orb b"></div>
<div class="bg-orb c"></div>

<!-- Scroll progress -->
<div class="scroll-bar" id="scrollBar"></div>

<div id="root"></div>

<!-- Brand primitives (Icon set, etc.) -->
<script type="text/babel" src="components/primitives.jsx"></script>

<!-- Website sections -->
<script type="text/babel" src="components/web-nav-hero.jsx"></script>
<script type="text/babel" src="components/web-about-services.jsx"></script>
<script type="text/babel" src="components/web-products.jsx"></script>
<script type="text/babel" src="components/web-team-projects.jsx"></script>
<script type="text/babel" src="components/web-contact-footer.jsx"></script>

<script type="text/babel">
function App() {
  // Scroll progress bar
  React.useEffect(() => {
    const bar = document.getElementById("scrollBar");
    const onScroll = () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
      if (bar) bar.style.width = pct + "%";
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  // Mouse-follow gradient (throttled via rAF)
  React.useEffect(() => {
    let raf = 0, x = 0, y = 0;
    const apply = () => {
      document.documentElement.style.setProperty("--mx", x + "px");
      document.documentElement.style.setProperty("--my", y + "px");
      raf = 0;
    };
    const onMove = (e) => {
      x = e.clientX; y = e.clientY;
      if (!raf) raf = requestAnimationFrame(apply);
    };
    window.addEventListener("mousemove", onMove);
    return () => window.removeEventListener("mousemove", onMove);
  }, []);

  // Reveal-on-scroll (3-pass, robust)
  React.useEffect(() => {
    const els = document.querySelectorAll(".reveal");

    // Pass 1: reveal anything already on screen
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      if (r.top < window.innerHeight && r.bottom > 0) el.classList.add("in");
    });

    // Pass 2: observer for the rest
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });

    els.forEach(el => { if (!el.classList.contains("in")) obs.observe(el); });

    // Pass 3: safety — after 1.2s force-reveal anything still hidden in view
    const t = setTimeout(() => {
      document.querySelectorAll(".reveal:not(.in)").forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight) el.classList.add("in");
      });
    }, 1200);

    return () => { obs.disconnect(); clearTimeout(t); };
  }, []);

  return (
    <>
      <Nav />
      <main>
        <Hero />
        <Trusted />
        <About />
        <Services />
        <ProductShowcase />
        <Portfolio />
        <Team />
        <FAQ />
        <Contact />
      </main>
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
